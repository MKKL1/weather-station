[project]
name = "heavyweather-cli"
version = "0.6.0"
description = "Heavy Weather CLI"
readme = "README.md"
requires-python = ">=3.9,<4.0"
authors = [
    { name = "MKKL1" }
]
dependencies = [
    "typer>=0.17.4",       # Removed the redundant [rich] extra flag
    "httpx>=0.28.0",
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
    "mnemonic>=0.21",
]

[project.scripts]
hw = "hw_cli.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Explicitly tell Hatchling where your Python source code lives
[tool.hatch.build.targets.wheel]
packages = ["hw_cli"]

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9.0.0",
]

[tool.pytest.ini_options]
addopts = "-q --tb=short"
testpaths = ["tests"]
