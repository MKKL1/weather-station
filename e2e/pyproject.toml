[project]
name = "heavyweather-e2e"
version = "0.1.0"
description = "End-to-End tests for HeavyWeather"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "heavyweather-cli",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.12.1",
    "pytest>=9.0.3",
    "pytest-env>=1.6.0",
    "pytest-ordering>=0.6",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]

[tool.uv.sources]
heavyweather-cli = { path = "../cli", editable = true }

