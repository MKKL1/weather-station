apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api-server
  name: api-server
  namespace: weather-app-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server
  strategy: {}
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
        - image: ghcr.io/mkkl1/weather-station/hw-server@sha256:5aab2a230b9e6f926325cc3c67d18ab9807cc9728ca07a4b5f433e3f93f6f933
          imagePullPolicy: Always
          name: api-server
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 80
              name: http
          env:
            - name: ASPNETCORE_URLS
              value: "http://0.0.0.0:80"
            - name: ASPNETCORE_ENVIRONMENT
              value: Production

            # Postgres
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: ws-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: ws-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ws-secrets
                  key: POSTGRES_PASSWORD
            - name: Postgres__ConnectionString
              value: "Host=postgres-sv;Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD);"

            # CosmosDB
            - name: COSMOS_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: ws-config
                  key: COSMOS_ENDPOINT
            - name: COSMOS_KEY
              valueFrom:
                configMapKeyRef:
                  name: ws-config
                  key: COSMOS_KEY
            - name: CosmosDb__ConnectionString
              value: "AccountEndpoint=$(COSMOS_ENDPOINT);AccountKey=$(COSMOS_KEY)"
            - name: CosmosDb__DatabaseName
              valueFrom:
                configMapKeyRef:
                  name: ws-config
                  key: COSMOS_DATABASE
            - name: CosmosDb__ViewsContainerName
              valueFrom:
                configMapKeyRef:
                  name: ws-config
                  key: COSMOS_CONTAINER_VIEWS
            - name: COSMOS_TLS_INSECURE
              valueFrom:
                configMapKeyRef:
                  name: ws-config
                  key: COSMOS_TLS_INSECURE

            # OIDC
            - name: KEYCLOAK_REALM
              valueFrom:
                configMapKeyRef:
                  name: ws-config
                  key: KEYCLOAK_REALM
            - name: Oidc__Authority
              value: "http://keycloak:8080/realms/$(KEYCLOAK_REALM)"
            - name: Oidc__Audience
              value: "account"
            - name: Oidc__RequireHttpsMetadata
              value: "false"

            #Provisioning service
            - name: DeviceAuthApi__BaseUrl
              value: "http://provisioning-sv:80/api/v1/devices/"
            - name: DeviceAuthApi__SharedSecret
              valueFrom:
                secretKeyRef:
                  name: ws-secrets
                  key: WORKER_SHARED_SECRET

            #Admin key
            - name: AdminApiKey__ApiKey
              valueFrom:
                secretKeyRef:
                  name: ws-secrets
                  key: ADMIN_API_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
              ephemeral-storage: "50Mi"
            limits:
              memory: "512Mi"
              cpu: "500m"
              ephemeral-storage: "100Mi"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: homelab.local/tier
                    operator: In
                    values:
                      - compute
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - api-server
                topologyKey: kubernetes.io/hostname
status: {}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: apiserver-sv
  name: apiserver-sv
  namespace: weather-app-dev
spec:
  ports:
    - name: 80-80
      port: 80
      protocol: TCP
      targetPort: 80
  selector:
    app: api-server
  type: ClusterIP
status:
  loadBalancer: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-server-policy
  namespace: weather-app-dev
spec:
  podSelector:
    matchLabels:
      app: api-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: cosmos
      ports:
        - protocol: TCP
          port: 8081
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: provisioning
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-server-pdb
  namespace: weather-app-dev
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-server
