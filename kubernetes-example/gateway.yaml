apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gateway
  name: gateway-dp
  namespace: weather-app-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - image: ghcr.io/mkkl1/weather-station/hw-gateway@sha256:121a89e6c39a359f43ba5add5b161c3379c92d609a66692e882c6c0f6685d9cd
          imagePullPolicy: Always
          name: hw-gateway
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            capabilities:
              drop:
                - ALL
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          ports:
            - containerPort: 8000
              name: api-port
          resources:
            limits:
              cpu: "500m"
              memory: "128Mi"
              ephemeral-storage: "100Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
              ephemeral-storage: "50Mi"
          env:
            - name: DEVICE_PUB_KEY_PATH
              value: "/keys/public.pem"
            - name: PROVISIONING_PUB_KEY_PATH
              value: "/keys/provisioning-public.pem"

            - name: MAIN_FN_URL
              value: "http://telemetry-worker-sv:80"
            - name: PROVISIONING_FN_URL
              value: "http://provisioning-sv:80"

            - name: DEVICE_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: ws-config
                  key: JWT_ISSUER_DEVICE
            - name: PROVISIONING_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: ws-config
                  key: JWT_ISSUER_PROVISIONING
            - name: WORKER_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: ws-secrets
                  key: WORKER_SHARED_SECRET
          volumeMounts:
            - name: keys-volume
              mountPath: /keys
              readOnly: true
            - name: tmp-volume
              mountPath: /tmp
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: homelab.local/tier
                    operator: In
                    values:
                      - edge
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - gateway
                topologyKey: kubernetes.io/hostname
      volumes:
        - name: keys-volume
          secret:
            secretName: ws-keys
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: gateway
  name: gateway-sv
  namespace: weather-app-dev
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8000
  selector:
    app: gateway
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-policy
  namespace: weather-app-dev
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: telemetry-worker
      ports:
        - protocol: TCP
          port: 80
    - to:
        - podSelector:
            matchLabels:
              app: provisioning
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-pdb
  namespace: weather-app-dev
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway
