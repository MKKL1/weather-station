apiVersion: batch/v1
kind: Job
metadata:
  name: cosmos-init
  namespace: weather-app-dev
spec:
  template:
    metadata:
      labels:
        app: cosmos-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-cosmos
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -v -w3 cosmos-sv 80; do
                echo "Waiting for Cosmos DB Emulator to start up..."
                sleep 3
              done
              echo "Cosmos DB is UP!"
      containers:
        - image: ghcr.io/mkkl1/weather-station/hw-cosmos-init@sha256:fab992dba5d5c702aa607985e193891df02cf20dd7f705215a2842d973642977
          name: cosmos-init
          env:
            - name: COSMOS_ENDPOINT
              value: http://cosmos-sv:80/
            - name: COSMOS_KEY
              valueFrom:
                configMapKeyRef:
                  name: ws-config
                  key: COSMOS_KEY
            - name: COSMOS_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: ws-config
                  key: COSMOS_DATABASE
          resources: {}
status: {}
