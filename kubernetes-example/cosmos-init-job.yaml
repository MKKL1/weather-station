apiVersion: batch/v1
kind: Job
metadata:
  name: cosmos-init
  namespace: weather-app-dev
spec:
  template:
    metadata:
      labels:
        app: cosmos-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-cosmos
          image: busybox:1.36
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              until nc -z -v -w3 cosmos-sv 8081; do
                echo "Waiting for Cosmos DB Emulator to start up..."
                sleep 3
              done
              echo "Cosmos DB is UP!"
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
              ephemeral-storage: "10Mi"
            limits:
              memory: "64Mi"
              cpu: "50m"
              ephemeral-storage: "20Mi"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      containers:
        - image: ghcr.io/mkkl1/weather-station/hw-cosmos-init@sha256:fab992dba5d5c702aa607985e193891df02cf20dd7f705215a2842d973642977
          imagePullPolicy: Always
          name: cosmos-init
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            capabilities:
              drop:
                - ALL
          env:
            - name: COSMOS_ENDPOINT
              value: http://cosmos-sv:8081/
            - name: COSMOS_KEY
              valueFrom:
                configMapKeyRef:
                  name: ws-config
                  key: COSMOS_KEY
            - name: COSMOS_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: ws-config
                  key: COSMOS_DATABASE
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
              ephemeral-storage: "50Mi"
            limits:
              memory: "128Mi"
              cpu: "500m"
              ephemeral-storage: "100Mi"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - cosmos
                topologyKey: kubernetes.io/hostname
status: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cosmos-init-policy
  namespace: weather-app-dev
spec:
  podSelector:
    matchLabels:
      app: cosmos-init
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: cosmos
      ports:
        - protocol: TCP
          port: 8081
