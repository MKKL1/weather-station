{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "heavy-weather.fullname" . }}-iot-ingress
  labels:
    {{- include "heavy-weather.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: {{ .Values.ingress.iot.ingressClassName | default "nginx"}}
  rules:
    - host: {{ .Values.ingress.iot.host | default "iot.weather.local" }}
      http:
        paths:
          - path: /v1(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "heavy-weather.fullname" . }}-gateway-sv
                port:
                  number: 80
{{- end }}
