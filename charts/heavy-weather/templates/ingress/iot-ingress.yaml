{{- if .Values.ingress.enabled }}
{{- $ingressClass := .Values.ingress.iot.ingressClassName | default "nginx" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "heavy-weather.fullname" . }}-iot-ingress
  labels:
    {{- include "heavy-weather.labels" . | nindent 4 }}
  annotations:
    {{- if eq $ingressClass "nginx" }}
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    {{- else if contains "traefik" $ingressClass }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ include "heavy-weather.fullname" . }}-strip-v1@kubernetescrd
    {{- end }}
    {{- with .Values.ingress.iot.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ $ingressClass }}
  rules:
    - host: {{ .Values.ingress.iot.host | default "iot.weather.local" }}
      http:
        paths:
          - path: {{ if eq $ingressClass "nginx" }}/v1(/|$)(.*){{ else }}/v1{{ end }}
            pathType: {{ if eq $ingressClass "nginx" }}ImplementationSpecific{{ else }}Prefix{{ end }}
            backend:
              service:
                name: {{ include "heavy-weather.fullname" . }}-gateway-sv
                port:
                  number: 80
{{- end }}

