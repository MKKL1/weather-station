{{- if and .Values.telemetryWorker.enabled .Values.telemetryWorker.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "heavy-weather.fullname" . }}-telemetry-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heavy-weather.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry-worker
spec:
  podSelector:
    matchLabels:
      {{- include "heavy-weather.componentSelectorLabels" (dict "ctx" . "component" "telemetry-worker") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "heavy-weather.componentSelectorLabels" (dict "ctx" . "component" "gateway") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 80
    
    {{- if .Values.telemetryWorker.networkPolicy.additionalIngress }}
    {{- toYaml .Values.telemetryWorker.networkPolicy.additionalIngress | nindent 4 }}
    {{- end }}

  egress:
    {{- include "heavy-weather.dnsEgress" . | nindent 4 }}
    
    {{- include "heavy-weather.egressToComponent" (dict "ctx" . "component" "azurite" "port" 10000) | nindent 4 }}
    {{- include "heavy-weather.egressToComponent" (dict "ctx" . "component" "azurite" "port" 10001) | nindent 4 }}
    {{- include "heavy-weather.egressToComponent" (dict "ctx" . "component" "azurite" "port" 10002) | nindent 4 }}
    {{- include "heavy-weather.egressToComponent" (dict "ctx" . "component" "cosmos" "port" 8081) | nindent 4 }}

    {{- if .Values.telemetryWorker.networkPolicy.additionalEgress }}
    {{- toYaml .Values.telemetryWorker.networkPolicy.additionalEgress | nindent 4 }}
    {{- end }}
{{- end }}
