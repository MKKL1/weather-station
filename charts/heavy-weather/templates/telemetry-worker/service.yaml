{{- if .Values.telemetryWorker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "heavy-weather.fullname" . }}-telemetry-worker-sv
  labels:
    {{- include "heavy-weather.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry-worker
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
  selector:
    {{- include "heavy-weather.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry-worker
  type: ClusterIP
{{- end }}
