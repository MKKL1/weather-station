{{- if .Values.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.keysSecret.name | default "ws-keys" }}
  labels:
    {{- include "heavy-weather.labels" . | nindent 4 }}
type: Opaque
data:
  private.pem: ""
  provisioning-private.pem: ""
  provisioning-public.pem: ""
  public.pem: ""
{{- end }}
