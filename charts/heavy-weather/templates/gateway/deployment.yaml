{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "heavy-weather.fullname" . }}-gateway
  labels:
    {{- include "heavy-weather.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount | default 2 }}
  selector:
    matchLabels:
      {{- include "heavy-weather.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "heavy-weather.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      {{- with .Values.global.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy | default .Values.global.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            {{- include "heavy-weather.containerSecurityContext" .Values.gateway | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          ports:
            - containerPort: 8000
              name: api-port
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          env:
            - name: DEVICE_PUB_KEY_PATH
              value: "/keys/public.pem"
            - name: PROVISIONING_PUB_KEY_PATH
              value: "/keys/provisioning-public.pem"
            - name: MAIN_FN_URL
              value: "http://{{ include "heavy-weather.fullname" . }}-telemetry-worker-sv:80"
            - name: PROVISIONING_FN_URL
              value: "http://{{ .Values.global.services.provisioning }}:80"
            - name: DEVICE_ISSUER
              value: "weather-station/device"
            - name: PROVISIONING_ISSUER
              value: "weather-station/provisioning"
            - name: WORKER_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: {{ .Values.global.secrets.keys.workerSharedSecret }}
          volumeMounts:
            - name: keys-volume
              mountPath: /keys
              readOnly: true
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: keys-volume
          secret:
            secretName: {{ .Values.global.keysSecret.name }}
        - name: tmp-volume
          emptyDir: {}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
