{{- if .Values.azurite.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: azurite-sv
  labels:
    {{- include "heavy-weather.labels" . | nindent 4 }}
    app.kubernetes.io/component: azurite
spec:
  clusterIP: None
  ports:
    - name: blob
      port: 10000
      protocol: TCP
      targetPort: 10000
    - name: queue
      port: 10001
      protocol: TCP
      targetPort: 10001
    - name: table
      port: 10002
      protocol: TCP
      targetPort: 10002
  selector:
    {{- include "heavy-weather.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: azurite
  type: ClusterIP
{{- end }}
