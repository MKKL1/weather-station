{{- if and .Values.keycloak.enabled .Values.keycloak.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "heavy-weather.fullname" . }}-keycloak
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heavy-weather.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  podSelector:
    matchLabels:
      {{- include "heavy-weather.componentSelectorLabels" (dict "ctx" . "component" "keycloak") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9000

    {{- if .Values.keycloak.networkPolicy.additionalIngress }}
    {{- toYaml .Values.keycloak.networkPolicy.additionalIngress | nindent 4 }}
    {{- end }}

  egress:
    {{- include "heavy-weather.dnsEgress" . | nindent 4 }}
    
    {{- include "heavy-weather.egressToComponent" (dict "ctx" . "component" "keycloak-postgres" "port" 5432) | nindent 4 }}

    {{- if .Values.keycloak.networkPolicy.additionalEgress }}
    {{- toYaml .Values.keycloak.networkPolicy.additionalEgress | nindent 4 }}
    {{- end }}
{{- end }}
