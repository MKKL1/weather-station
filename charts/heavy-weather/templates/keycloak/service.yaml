{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.global.services.keycloak | default "keycloak-sv" }}
  labels:
    {{- include "heavy-weather.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  ports:
    - port: 80
      targetPort: 8080
  selector:
    {{- include "heavy-weather.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
  type: ClusterIP
{{- end }}
