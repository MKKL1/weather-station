{{- if and .Values.keycloakPostgres.enabled .Values.keycloakPostgres.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "heavy-weather.fullname" . }}-keycloak-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heavy-weather.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-postgres
spec:
  podSelector:
    matchLabels:
      {{- include "heavy-weather.componentSelectorLabels" (dict "ctx" . "component" "keycloak-postgres") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "heavy-weather.componentSelectorLabels" (dict "ctx" . "component" "keycloak") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432

    {{- if .Values.keycloakPostgres.networkPolicy.additionalIngress }}
    {{- toYaml .Values.keycloakPostgres.networkPolicy.additionalIngress | nindent 4 }}
    {{- end }}

  egress:
    {{- include "heavy-weather.dnsEgress" . | nindent 4 }}

    {{- if .Values.keycloakPostgres.networkPolicy.additionalEgress }}
    {{- toYaml .Values.keycloakPostgres.networkPolicy.additionalEgress | nindent 4 }}
    {{- end }}
{{- end }}
