{{- if .Values.cosmosDbEmulator.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "heavy-weather.fullname" . }}-cosmos-init
  labels:
    {{- include "heavy-weather.labels" . | nindent 4 }}
    app.kubernetes.io/component: cosmos-init
spec:
  template:
    metadata:
      labels:
        {{- include "heavy-weather.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cosmos-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-cosmos
          image: busybox:1.36
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              until nc -z -v -w3 cosmos-sv 8081; do
                echo "Waiting for Cosmos DB Emulator to start up..."
                sleep 3
              done
              echo "Cosmos DB is UP!"
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
              ephemeral-storage: "10Mi"
            limits:
              memory: "64Mi"
              cpu: "50m"
              ephemeral-storage: "20Mi"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      containers:
        - name: cosmos-init
          image: "ghcr.io/mkkl1/weather-station/hw-cosmos-init:latest"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            capabilities:
              drop:
                - ALL
          env:
            - name: COSMOS_ENDPOINT
              value: "http://cosmos-sv:8081/"
            - name: COSMOS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: {{ .Values.global.secrets.keys.cosmosKey }}
            - name: COSMOS_DATABASE
              value: {{ .Values.global.cosmosDb.database | default "weather-station-db" | quote }}
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
              ephemeral-storage: "50Mi"
            limits:
              memory: "128Mi"
              cpu: "500m"
              ephemeral-storage: "100Mi"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - cosmos
                topologyKey: kubernetes.io/hostname
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "heavy-weather.fullname" . }}-cosmos-init-policy
  labels:
    {{- include "heavy-weather.labels" . | nindent 4 }}
    app.kubernetes.io/component: cosmos-init
spec:
  podSelector:
    matchLabels:
      {{- include "heavy-weather.componentSelectorLabels" (dict "ctx" . "component" "cosmos-init") | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "heavy-weather.componentSelectorLabels" (dict "ctx" . "component" "cosmos") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8081
{{- end }}
