{{- if and .Values.provisioning.enabled .Values.provisioning.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "heavy-weather.fullname" . }}-provisioning
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heavy-weather.labels" . | nindent 4 }}
    app.kubernetes.io/component: provisioning
spec:
  podSelector:
    matchLabels:
      {{- include "heavy-weather.componentSelectorLabels" (dict "ctx" . "component" "provisioning") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "heavy-weather.componentSelectorLabels" (dict "ctx" . "component" "api-server") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "heavy-weather.componentSelectorLabels" (dict "ctx" . "component" "gateway") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{ include "heavy-weather.fullname" . }}-client: "true"
      ports:
        - protocol: TCP
          port: {{ .Values.provisioning.containerPort | default 8080 }}

    {{- if .Values.provisioning.networkPolicy.additionalIngress }}
    {{- toYaml .Values.provisioning.networkPolicy.additionalIngress | nindent 4 }}
    {{- end }}

  egress:
    {{- include "heavy-weather.dnsEgress" . | nindent 4 }}

    {{- include "heavy-weather.egressToComponent" (dict "ctx" . "component" "cosmos" "port" 8081) | nindent 4 }}

    {{- if .Values.provisioning.networkPolicy.additionalEgress }}
    {{- toYaml .Values.provisioning.networkPolicy.additionalEgress | nindent 4 }}
    {{- end }}
{{- end }}
