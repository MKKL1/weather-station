{{- if and .Values.postgres.enabled .Values.postgres.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "heavy-weather.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heavy-weather.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      {{- include "heavy-weather.componentSelectorLabels" (dict "ctx" . "component" "postgres") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "heavy-weather.componentSelectorLabels" (dict "ctx" . "component" "api-server") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "heavy-weather.componentSelectorLabels" (dict "ctx" . "component" "db-migration") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{ include "heavy-weather.fullname" . }}-client: "true"
      ports:
        - protocol: TCP
          port: 5432

    {{- if .Values.postgres.networkPolicy.additionalIngress }}
    {{- toYaml .Values.postgres.networkPolicy.additionalIngress | nindent 4 }}
    {{- end }}

  egress:
    {{- include "heavy-weather.dnsEgress" . | nindent 4 }}

    {{- if .Values.postgres.networkPolicy.additionalEgress }}
    {{- toYaml .Values.postgres.networkPolicy.additionalEgress | nindent 4 }}
    {{- end }}
{{- end }}
